<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8bea72"/>
      <stop offset="55%" stop-color="#3ecb52"/>
      <stop offset="100%" stop-color="#2a9e3c"/>
    </linearGradient>
  </defs>

  <!-- Soft shadow under the blob -->
  <ellipse cx="16" cy="26.5" rx="12" ry="1.6" fill="#1c1917" opacity="0.25"/>

  <!-- Body: dome with a squishy, slightly wavy bottom -->
  <path d="M 4 25.5
           Q 3.5 14 9 9.5 Q 13 6 16 6 Q 19 6 23 9.5 Q 28.5 14 28 25.5
           Q 25 26.8 22 25.8 Q 19 24.8 16 25.8 Q 13 26.8 10 25.8 Q 7 24.8 4 25.5 Z"
        fill="url(#jelly)" stroke="#1f7a2e" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Glossy highlight -->
  <path d="M 8.5 12.5 Q 9.5 9.5 12.5 8.5"
        fill="none" stroke="#d9f9c9" stroke-width="2"
        stroke-linecap="round" opacity="0.9"/>

  <!-- Eyes -->
  <ellipse cx="12" cy="16.5" rx="1.7" ry="2.3" fill="#143018"/>
  <ellipse cx="20" cy="16.5" rx="1.7" ry="2.3" fill="#143018"/>
  <circle cx="12.6" cy="15.7" r="0.6" fill="#eafbe2"/>
  <circle cx="20.6" cy="15.7" r="0.6" fill="#eafbe2"/>

  <!-- Smile -->
  <path d="M 14 20.5 Q 16 22.3 18 20.5"
        fill="none" stroke="#143018" stroke-width="1.1" stroke-linecap="round"/>
</svg>
